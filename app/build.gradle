android {
    namespace "com.seu.dominio.seuapp"   // <--- substitua pelo seu namespace real
    compileSdk 33

    defaultConfig {
        applicationId "com.seu.dominio.seuapp" // <--- mantenha consistente com namespace
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

