plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.8.22'
}

android {
    namespace "com.seudominio.seuapp"   // <-- substitua pelo seu namespace real
    compileSdk 33

    defaultConfig {
        applicationId "com.seudominio.seuapp" // <-- mantenha consistente
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    // adicione aqui suas outras dependências, por exemplo:
    // implementation 'androidx.core:core-ktx:1.9.0'
}
